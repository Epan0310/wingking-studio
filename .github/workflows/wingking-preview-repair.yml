name: Wingking verified preview repairs
on:
  push:
    branches: [dev/unknown2-1]
    paths: [.github/workflows/wingking-preview-repair.yml]
permissions:
  contents: write
jobs:
  verified-repairs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: dev/unknown2-1
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify and apply source repairs
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --output /tmp/wingking-preview-patch.mjs 'https://c9ab7109-d689-480d-86f7-318f0529f108.sandbox.floot.app/_cdn/static/wingking-safety-ui-patch-v2.mjs'
          echo '3bd3b0585e4520adc1b27de69bc69064d9bd29eaafa69e2bda6b25b29ff4089b  /tmp/wingking-preview-patch.mjs' | sha256sum -c -
          node /tmp/wingking-preview-patch.mjs
          git diff --check
      - name: Run tests and full build
        run: |
          npm ci --no-audit --no-fund
          npx prisma generate
          npm run test:booking
          npx tsc --noEmit
          npm run build
      - name: Push changes to the requested branch only
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = dev/unknown2-1
          rm .github/workflows/wingking-preview-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A app/globals.css app/admin/actions.ts app/admin/page.tsx components/BookingForm.tsx components/SiteMotion.tsx .github/workflows/wingking-preview-repair.yml
          git diff --cached --check
          git commit -m 'fix: preview fallback and admin booking conflict safety'
          git push origin HEAD:dev/unknown2-1
