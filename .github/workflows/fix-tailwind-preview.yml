'EOF'
          export default {
            plugins: {
              "@tailwindcss/postcss": {},
            },
          };
          EOF
      - name: Verify real Tailwind-generated CSS
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npx prisma generate
          npm run test:booking
          npx tsc --noEmit
          npm run build
          test -d .next/static
          if ! grep -R --include='*.css' -qF '.grid{' .next; then
            echo 'ERROR: Tailwind utility grid was not compiled'
            exit 1
          fi
          if ! grep -R --include='*.css' -qF '.flex{' .next; then
            echo 'ERROR: Tailwind utility flex was not compiled'
            exit 1
          fi
          find .next/static -name '*.css' -printf '%p %s bytes\n'
      - name: Push fix to branch only
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = dev/unknown2-1
          rm .github/workflows/fix-tailwind-preview.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json postcss.config.mjs .github/workflows/fix-tailwind-preview.yml
          git diff --cached --check
          git commit -m 'fix: compile Tailwind v4 utilities in Vercel preview'
          git push origin HEAD:dev/unknown2-1
