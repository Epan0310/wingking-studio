name: Wingking branch upgrade v2
on:
  push:
    branches: [dev/unknown2-1]
    paths: [.github/workflows/wingking-upgrade-v2.yml]
permissions:
  contents: write
jobs:
  apply-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: dev/unknown2-1
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply checked upgrade
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --output /tmp/wingking.zip 'https://c9ab7109-d689-480d-86f7-318f0529f108.sandbox.floot.app/_cdn/static/da994591-b75d-4ee1-894d-a1e8ce8d00ac-wingking-studio-dev-unknown2-1-upgrade.zip'
          echo '3309c4e7b32328eee0f17fc22faff2ac7bcba1d3d96108ff5428deafad351c1b  /tmp/wingking.zip' | sha256sum -c -
          unzip -q /tmp/wingking.zip -d "$RUNNER_TEMP"
          sed -i "/'dispatches label')/d" "$RUNNER_TEMP/wingking-dev/scripts/apply-ui.py"
          bash "$RUNNER_TEMP/wingking-dev/apply.sh" "$GITHUB_WORKSPACE"
      - name: Validate upgrade
        run: |
          npm ci
          npx prisma generate
          npm run test:booking
          npx tsc --noEmit
      - name: Push upgraded sources to dev branch only
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = dev/unknown2-1
          rm .github/workflows/wingking-upgrade.yml
          rm .github/workflows/wingking-upgrade-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add Wingking booking engine, admin and responsive UI'
          git push origin HEAD:dev/unknown2-1
